server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location ^~ /.deploy-keys/ { deny all; return 404; }
    location ^~ /.git/ { deny all; return 404; }
    location ^~ /.github/ { deny all; return 404; }
    location ^~ /mail-api/ { deny all; return 404; }
    location ^~ "/Mail Mass/owner-setup/" { deny all; return 404; }

    location /api/ {
        proxy_pass http://mail-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ~* \.(vbs|ps1|zip)$ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Same homepage file and cache policy for / and /index.html
    # (Cloudflare + browsers previously could keep a stale copy of /)
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header CDN-Cache-Control "no-store";
        add_header Cloudflare-CDN-Cache-Control "no-store";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header CDN-Cache-Control "no-store";
        add_header Cloudflare-CDN-Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }
}
