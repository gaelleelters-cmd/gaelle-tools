server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location ^~ /.deploy-keys/ { deny all; return 404; }
    location ^~ /.git/ { deny all; return 404; }
    location ^~ /.github/ { deny all; return 404; }
    location ^~ /mail-api/ { deny all; return 404; }
    location ^~ "/Mail Mass/owner-setup/" { deny all; return 404; }
    location ^~ "/Mail Mass/helper/" { deny all; return 404; }

    location /api/ {
        proxy_pass http://mail-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ~* \.(vbs|ps1|zip)$ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
