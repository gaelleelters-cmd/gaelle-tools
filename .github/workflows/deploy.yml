name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Mail Mass Microsoft client ID
        shell: bash
        env:
          MAILMASS_CLIENT_ID: ${{ secrets.MAILMASS_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${MAILMASS_CLIENT_ID:-}" ]; then
            python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path("Mail Mass/js/config.js")
          text = p.read_text(encoding="utf-8")
          cid = os.environ["MAILMASS_CLIENT_ID"].strip()
          text = text.replace("MAILMASS_CLIENT_ID_PLACEHOLDER", cid)
          p.write_text(text, encoding="utf-8")
          print("Injected MAILMASS_CLIENT_ID")
          PY
          else
            echo "WARN: MAILMASS_CLIENT_ID secret missing — Mail Mass cannot send from each user's mailbox until set."
          fi

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p /opt/newapp
            docker rm -f newapp-placeholder 2>/dev/null || true
            docker rm -f gaelle-tools-web gaelle-tools-mail 2>/dev/null || true
            cd /opt/newapp
            if [ -f docker-compose.yml ]; then
              docker compose down || true
            fi
            chmod -R u+w /opt/newapp 2>/dev/null || true
            find /opt/newapp -mindepth 1 -delete

      - name: Upload site to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: ".,!.git,!.github,!.deploy-keys"
          target: /opt/newapp
          rm: false
          overwrite: true

      - name: Write SMTP env for mail API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM,SMTP_SECURE
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/newapp
            umask 077
            {
              echo "SMTP_HOST=${SMTP_HOST}"
              echo "SMTP_PORT=${SMTP_PORT:-587}"
              echo "SMTP_USER=${SMTP_USER}"
              echo "SMTP_PASS=${SMTP_PASS}"
              echo "SMTP_FROM=${SMTP_FROM}"
              echo "SMTP_SECURE=${SMTP_SECURE:-false}"
              echo "CONTACT_TO=${CONTACT_TO:-info@gaelleelters.com}"
            } > .env
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}

      - name: Start / refresh container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/newapp
            chmod -R u+rwX /opt/newapp
            docker compose up -d --build --pull missing
            docker compose ps
            curl -fsS -o /dev/null http://127.0.0.1:8080/ && echo "Site OK on :8080"
            curl -fsS http://127.0.0.1:8080/api/health || true
