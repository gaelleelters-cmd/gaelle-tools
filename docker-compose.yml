services:
  web:
    image: nginx:alpine
    container_name: gaelle-tools-web
    restart: unless-stopped
    ports:
      # Cloudflare tunnel -> host :8080 (see README.txt)
      - "8080:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
