<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toolkit</title>
  <meta name="description" content="Everyday tools for WhatsApp and Excel — built for agents who need to move fast.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css?v=20260720h">
</head>
<body>
  <div class="page" id="home">
    <!-- HERO -->
    <header class="hero">
      <div class="hero-bg" aria-hidden="true">
        <div class="hero-mesh"></div>
        <div class="hero-grid"></div>
        <div class="hero-blob hero-blob-1"></div>
        <div class="hero-blob hero-blob-2"></div>
        <div class="hero-blob hero-blob-3"></div>
        <div class="hero-shine"></div>
      </div>

      <div class="hero-inner">
        <div class="brand">
          <p class="brand-main">Toolkit</p>
        </div>
        <h1 class="hero-title">Your daily work,<br>made simpler.</h1>
        <div class="hero-cta">
          <a class="btn-primary" href="#tools">See the tools</a>
        </div>
      </div>
    </header>

    <!-- TOOLS -->
    <section class="tools" id="tools">
      <div class="section-head">
        <h2 class="section-title">Pick what you need</h2>
      </div>

      <div class="tool-rail" aria-label="Choose a tool">
        <button type="button" class="tool-panel tool-panel--wa" data-src="Gaelle%20Whatsapp%20Tool/index.html" data-label="WhatsApp Tool">
          <div class="tool-panel-visual" aria-hidden="true">
            <span class="chip chip-a"></span>
            <span class="chip chip-b"></span>
            <span class="chip chip-c"></span>
          </div>
          <div class="tool-panel-body">
            <h3 class="tool-panel-name">WhatsApp Tool</h3>
            <p class="tool-panel-copy">Send a message, generate Excel / Sheets formulas, bulk-create links, or prepare Meta API credentials.</p>
            <span class="tool-panel-action">Open WhatsApp Tool</span>
          </div>
        </button>

        <button type="button" class="tool-panel tool-panel--mail" data-src="Mail%20Mass/index.html" data-label="Mail Mass">
          <div class="tool-panel-visual" aria-hidden="true">
            <span class="mail-line mail-1"></span>
            <span class="mail-line mail-2"></span>
            <span class="mail-line mail-3"></span>
          </div>
          <div class="tool-panel-body">
            <h3 class="tool-panel-name">Mail Mass</h3>
            <p class="tool-panel-copy">Like Word mail merge — upload Excel, click Send, emails go from your own Outlook / Microsoft mailbox.</p>
            <span class="tool-panel-action">Open Mail Mass</span>
          </div>
        </button>

        <button type="button" class="tool-panel tool-panel--xl" data-src="COMBINE/index.html" data-label="Excel Combiner">
          <div class="tool-panel-visual" aria-hidden="true">
            <span class="sheet sheet-1"></span>
            <span class="sheet sheet-2"></span>
            <span class="sheet sheet-3"></span>
          </div>
          <div class="tool-panel-body">
            <h3 class="tool-panel-name">Excel Combiner</h3>
            <p class="tool-panel-copy">Upload several donor files, align phone columns, remove duplicates, and download one clean combined sheet.</p>
            <span class="tool-panel-action">Open Excel Combiner</span>
          </div>
        </button>
      </div>
    </section>

    <!-- WHY -->
    <section class="why">
      <div class="why-inner">
        <p class="section-kicker section-kicker--on-dark">Why this exists</p>
        <h2 class="why-title">Less clicking around.<br>More done.</h2>
        <div class="why-grid">
          <div class="why-item">
            <strong>Safe &amp; simple</strong>
            <span>Files stay in your browser. No account required.</span>
          </div>
        </div>
      </div>
    </section>

    <footer class="site-foot">
      <span class="brand-mini">Toolkit · GaelleElTers</span>
      <span>For everyday agent work</span>
    </footer>
  </div>

  <!-- WORKSPACE -->
  <section class="workspace is-hidden" id="workspace" aria-hidden="true">
    <header class="workspace-bar">
      <button type="button" class="back-btn" id="back-home"><span aria-hidden="true">←</span> Home</button>
      <div class="workspace-brand">Toolkit</div>
      <h2 class="workspace-title" id="stage-title">WhatsApp Tool</h2>
      <a class="open-new" id="open-new" href="Gaelle%20Whatsapp%20Tool/index.html" target="_blank" rel="noopener">Open in new tab</a>
    </header>
    <div class="frame-wrap">
      <iframe id="app-frame" class="app-frame" title="Tool" src="about:blank"></iframe>
    </div>
  </section>

  <script src="js/site.js?v=20260720mail"></script>
</body>
</html>
