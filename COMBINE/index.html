<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Combiner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1 class="brand">Excel Combiner</h1>
    <p class="tagline">Merge multiple Excel or CSV files into one sheet — in your browser.</p>
  </header>

  <main class="main">
    <section class="dropzone" id="dropzone">
      <input type="file" id="file-input" accept=".csv,.xlsx,.xls" multiple hidden>
      <div class="dropzone-inner" id="dropzone-inner">
        <p class="drop-title">Drop Excel or CSV files here</p>
        <p class="drop-sub">or <button type="button" class="link-btn" id="browse-btn">browse</button> — multiple files allowed</p>
      </div>
    </section>

    <section class="file-list hidden" id="file-list-section">
      <div class="section-head">
        <h2>Files <span class="count" id="file-count">0</span></h2>
        <button type="button" class="btn btn-ghost" id="clear-files">Clear all</button>
      </div>
      <ul class="files" id="file-list"></ul>
    </section>

    <section class="options hidden" id="options-section">
      <h2>Options</h2>
      <div class="option-grid">
        <label class="check">
          <input type="checkbox" id="opt-dedupe" checked>
          <span>Remove duplicate rows by key column</span>
        </label>
        <div class="field" id="dedupe-field">
          <label for="dedupe-col">Dedupe key</label>
          <select id="dedupe-col"></select>
        </div>
        <label class="check">
          <input type="checkbox" id="opt-source" checked>
          <span>Add Source File column</span>
        </label>
        <label class="check">
          <input type="checkbox" id="opt-align" checked>
          <span>Align similar columns (e.g. Phone / Mobile)</span>
        </label>
        <div class="field">
          <label for="out-name">Output file name</label>
          <input type="text" id="out-name" value="Combined_All_Donors" dir="ltr">
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="combine-btn">Combine &amp; Download</button>
        <button type="button" class="btn btn-secondary" id="preview-btn">Preview</button>
      </div>
    </section>

    <section class="preview hidden" id="preview-section">
      <div class="section-head">
        <h2>Preview <span class="count" id="row-count"></span></h2>
      </div>
      <div class="table-scroll">
        <table class="data-table" id="preview-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
