<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Combiner</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260720shell">
</head>
<body>
  <header class="hero" id="hero">
    <div class="hero-mesh" aria-hidden="true"></div>
    <div class="hero-orbs" aria-hidden="true">
      <div class="hero-orb hero-orb--1"></div>
      <div class="hero-orb hero-orb--2"></div>
      <div class="hero-orb hero-orb--3"></div>
    </div>
    <div class="hero-bubbles" aria-hidden="true">
      <div class="chat-bubble cb-1"></div>
      <div class="chat-bubble cb-2"></div>
      <div class="chat-bubble cb-3"></div>
    </div>
    <div class="hero-emoji-field" aria-hidden="true">
      <span class="jump-emoji je-1">📊</span>
      <span class="jump-emoji je-2 is-far">📁</span>
      <span class="jump-emoji je-3">📑</span>
      <span class="jump-emoji je-4 is-far">🧮</span>
      <span class="jump-emoji je-6">✅</span>
      <span class="jump-emoji je-7 is-far">📗</span>
      <span class="jump-emoji je-8">🔗</span>
      <span class="jump-emoji je-9 is-far">📥</span>
      <span class="jump-emoji je-11">🗂️</span>
      <span class="jump-emoji je-12 is-far">💾</span>
      <span class="jump-emoji je-13">📈</span>
      <span class="jump-emoji je-14">🧩</span>
      <span class="jump-emoji je-16">✨</span>
    </div>
    <div class="hero-content">
      <h1 class="hero-title">
        <span class="hero-title-brand">Excel Combiner</span>
        <span class="hero-title-tool">Tool</span>
      </h1>
    </div>
  </header>

  <main class="main">
    <p class="page-lead">Merge multiple Excel or CSV files into one sheet — in your browser.</p>

    <nav class="tabs" role="tablist" aria-label="Combiner steps">
      <a class="tab active" href="#step-upload">
        <span class="tab-icon">📂</span>
        Upload
      </a>
      <a class="tab" href="#step-files">
        <span class="tab-icon">📄</span>
        Files
      </a>
      <a class="tab" href="#step-options">
        <span class="tab-icon">⚙️</span>
        Options
      </a>
      <a class="tab" href="#step-preview">
        <span class="tab-icon">👁️</span>
        Preview
      </a>
    </nav>

    <section class="panel" id="step-upload">
      <div class="card">
        <div class="dropzone" id="dropzone">
          <input type="file" id="file-input" accept=".csv,.xlsx,.xls" multiple hidden>
          <div class="dropzone-inner" id="dropzone-inner">
            <p class="drop-title">Drop Excel or CSV files here</p>
            <p class="drop-sub">or <button type="button" class="link-btn" id="browse-btn">browse</button> — multiple files allowed</p>
          </div>
        </div>
      </div>
    </section>

    <section class="panel file-list hidden" id="file-list-section">
      <div class="card" id="step-files">
        <div class="section-head">
          <h2>Files <span class="count" id="file-count">0</span></h2>
          <button type="button" class="btn btn-ghost" id="clear-files">Clear all</button>
        </div>
        <ul class="files" id="file-list"></ul>
      </div>
    </section>

    <section class="panel options hidden" id="options-section">
      <div class="card" id="step-options">
        <div class="card-header">
          <h2>Options</h2>
        </div>
        <div class="option-grid">
          <label class="check">
            <input type="checkbox" id="opt-dedupe" checked>
            <span>Remove duplicate rows by key column</span>
          </label>
          <div class="field" id="dedupe-field">
            <label for="dedupe-col">Dedupe key</label>
            <select id="dedupe-col"></select>
          </div>
          <label class="check">
            <input type="checkbox" id="opt-source" checked>
            <span>Add Source File column</span>
          </label>
          <label class="check">
            <input type="checkbox" id="opt-align" checked>
            <span>Align similar columns (e.g. Phone / Mobile)</span>
          </label>
          <div class="field">
            <label for="out-name">Output file name</label>
            <input type="text" id="out-name" value="Combined_All_Donors" dir="ltr">
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn btn-primary btn-lg" id="combine-btn">Combine &amp; Download</button>
          <button type="button" class="btn btn-secondary" id="preview-btn">Preview</button>
        </div>
      </div>
    </section>

    <section class="panel preview hidden" id="preview-section">
      <div class="card" id="step-preview">
        <div class="section-head">
          <h2>Preview <span class="count" id="row-count"></span></h2>
        </div>
        <div class="table-scroll">
          <table class="data-table" id="preview-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var tabs = document.querySelectorAll('.tabs .tab');
      if (!tabs.length) return;
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) { t.classList.remove('active'); });
          tab.classList.add('active');
        });
      });
    })();
  </script>
</body>
</html>
